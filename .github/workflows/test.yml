name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.26.10']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Install Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
    - name: Test
      run: |
        go test -race ./...
        go vet ./...
        go build -o "$RUNNER_TEMP/bibfuse" ./cmd/bibfuse
        go version -m "$RUNNER_TEMP/bibfuse"
        "$RUNNER_TEMP/bibfuse" -version
        "$RUNNER_TEMP/bibfuse" -h
