version: 2.1

orbs:
  codecov: codecov/codecov@6.1.0

jobs:
  build:
    docker:
      - image: golang:1.26.10
    steps:
      - checkout
      - run:
          name: Run tests and coverage
          command: go test -race -coverprofile=coverage.txt -covermode=atomic ./...
      - codecov/upload:
          files: coverage.txt
          disable_search: true
          fail_on_error: true

workflows:
  build-test:
    jobs:
      - build
